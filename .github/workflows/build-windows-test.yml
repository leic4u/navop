name: Build Windows x64 Test

# 临时 workflow：在 windows-2022 runner（自带 MSVC）上用 x86_64-pc-windows-msvc 编译
# support_more_sync_data 分支的 main，仅上传 navop.exe 制品，供本地用 WiX 打成安装包测试。
# 验证完成后会删除本文件。

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "fast (thin LTO) or release (fat LTO)"
        required: false
        default: fast

jobs:
  build:
    name: Build windows-x64 (test)
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
          cache: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build release binary (Windows)
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NAVOP_PUBLIC_BASE_URL: ${{ vars.NAVOP_PUBLIC_BASE_URL }}
          NAVOP_WEBSITE_BASE_URL: ${{ vars.NAVOP_WEBSITE_BASE_URL }}
          ONETCLI_TEAM_MANAGEMENT_URL_TEMPLATE: ${{ vars.ONETCLI_TEAM_MANAGEMENT_URL_TEMPLATE }}
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VCToolsInstallDir)) {
            throw "VCToolsInstallDir is not configured"
          }
          $target = "x86_64-pc-windows-msvc"
          $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "MSVC linker was not found at '$linker'"
          }
          $linkerEnvironmentName = "CARGO_TARGET_$($target.Replace('-', '_').ToUpperInvariant())_LINKER"
          [Environment]::SetEnvironmentVariable(
            $linkerEnvironmentName,
            $linker,
            [EnvironmentVariableTarget]::Process
          )
          cargo --version
          rustc --version
          Write-Host "Using MSVC linker for ${target}: $linker"
          cargo build --release -p main --features windows-native-rdp --target $target
          $binary = "target\$target\release\navop.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Release binary was not created: '$binary'"
          }

      - name: Upload navop.exe
        uses: actions/upload-artifact@v4
        with:
          name: navop-windows-x64-test
          path: target/x86_64-pc-windows-msvc/release/navop.exe
